[project]
name = "studymate-backend"
version = "0.1.0"
description = "StudyMate RAG Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "fastapi-cloud-cli>=0.26.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.3.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "httpx>=0.27.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

